<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <script>
    // Runs before CSS renders — sets data-theme on <html> to avoid a
    // flash of the wrong theme. Reads saved preference (system/dark/light)
    // and, for "system", resolves it against the OS setting right now.
    (function () {
      try {
        var pref = localStorage.getItem('pumpguru-theme') || 'system';
        var resolved = (pref === 'system')
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : pref;
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.setAttribute('data-theme-pref', pref);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}PUMPGURU{% endblock %} — Monitoring System</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    .brand-mark img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      /* Keeps the logo aspect ratio intact */
      display: block;
    }


    /* ============================================================
     SIDEBAR TANK WIDGET
     Lives in every page's sidebar (base.html), polls /api/live on
     its own, and mirrors the same low/high decode logic used on
     the Tanks page and the run/stop register used on the dashboard.
     Uses only the app's existing theme variables so it follows
     light/dark automatically.
     ============================================================ */
    .sidebar-divider {
      height: 1px;
      background: var(--border);
      margin: 6px 0 18px;
    }

    .widget-label {
      font-size: 10.5px;
      letter-spacing: 0.08em;
      font-weight: 700;
      color: var(--text-dim);
      margin: 0 0 10px 2px;
      text-transform: uppercase;
    }

    .tank-widget {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 12px 12px;
      margin-bottom: 18px;
    }

    .tank-widget svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .sb-tank-box {
      fill: var(--bg-card, rgba(255, 255, 255, 0.03));
      stroke: var(--border);
      stroke-width: 2;
    }

    .sb-tank-label {
      font-size: 9.5px;
      font-weight: 700;
      fill: var(--text-dim);
      font-family: var(--font-mono, monospace);
    }

    .sb-mark-line {
      stroke: var(--text-faint);
      stroke-width: 2;
      stroke-dasharray: 2 2;
    }

    .sb-mark-text {
      font-size: 7px;
      fill: var(--text-faint);
      font-family: var(--font-mono, monospace);
    }

    .sb-pipe {
      fill: none;
      stroke: var(--border);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .sb-flow {
      fill: none;
      stroke: var(--accent-cyan);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 6 8;
      opacity: 0;
      transition: opacity 0.25s;
    }

    .sb-flow.flowing {
      opacity: 1;
      animation: sb-flow-dash 0.7s linear infinite;
    }

    @keyframes sb-flow-dash {
      to {
        stroke-dashoffset: -28;
      }
    }

    .sb-motor-circle {
      fill: var(--bg-panel);
      stroke: var(--text-faint);
      stroke-width: 2.5;
      transition: stroke 0.25s;
    }

    .sb-motor-circle.running {
      stroke: var(--accent-green);
    }

    .sb-motor-blades {
      stroke: var(--text-faint);
      stroke-width: 3;
      stroke-linecap: round;
      transform-origin: 120px 70px;
      transition: stroke 0.25s;
    }

    .sb-motor-blades.running {
      stroke: var(--accent-green);
      animation: sb-spin 1s linear infinite;
    }

    .sb-motor-hub {
      fill: var(--text-faint);
      transition: fill 0.25s;
    }

    .sb-motor-hub.running {
      fill: var(--accent-green);
    }

    @keyframes sb-spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .sb-stop-a {
      stop-color: var(--accent-cyan);
    }

    .sb-stop-b {
      stop-color: var(--accent-cyan);
      stop-opacity: 0.55;
    }

    .sb-water-error {
      fill: var(--accent-red);
      opacity: 0;
      transition: opacity 0.25s;
    }

    .widget-status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 11px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .widget-status-row .pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(76, 175, 125, 0.12);
      color: var(--accent-green);
    }

    .widget-status-row .pill.off {
      background: var(--bg-panel-2, rgba(255, 255, 255, 0.04));
      color: var(--text-faint);
    }

    .widget-status-row .pill.err {
      background: rgba(217, 83, 79, 0.12);
      color: var(--accent-red);
    }

    .widget-status-row .pill span.blip {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    .widget-status-row .pill.off span.blip {
      background: var(--text-faint);
    }

    .widget-status-row .pill.err span.blip {
      background: var(--accent-red);
    }


    /* ============================================================
   GLOBAL FAULT MODAL
   ============================================================ */
    .fault-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .fault-modal-overlay.show {
      display: flex;
    }

    .fault-modal-card {
      background: var(--bg-panel);
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
    }

    .fault-modal-topbar {
      height: 5px;
      background: var(--accent-red);
    }

    .fault-modal-body {
      padding: 26px 26px 22px;
    }

    .fault-modal-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    .fault-modal-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(217, 83, 79, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 22px;
      color: var(--accent-red);
    }

    .fault-modal-eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 4px;
    }

    .fault-modal-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }

    .fault-modal-help {
      background: var(--bg-panel-2, rgba(255, 255, 255, 0.04));
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 22px;
    }

    .fault-modal-help-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-bottom: 8px;
    }

    .fault-modal-help-text {
      font-size: 14px;
      line-height: 1.55;
      color: var(--text-dim);
    }

    .fault-modal-ack-btn {
      width: 100%;
      background: var(--accent-red);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: filter .15s;
    }

    .fault-modal-ack-btn:hover {
      filter: brightness(1.08);
    }
  </style>
</head>

  <script>
    /* ================================================================
       SIDEBAR TANK WIDGET — live logic
       Same decode rules as the Tanks page:
         low=1,high=1 -> FULL   low=1,high=0 -> HALF
         low=0,high=0 -> EMPTY  anything else -> SENSOR ERROR
       Motor state comes from control_run_stop (1 = running).
       Polls /api/live independently of whatever page is loaded.
       ================================================================ */
    (function () {
      const bottomWater = document.getElementById('sb-bottomWater');
      const bottomError = document.getElementById('sb-bottomError');
      const topWater = document.getElementById('sb-topWater');
      const topError = document.getElementById('sb-topError');
      const motorCircle = document.getElementById('sb-motorCircle');
      const motorBlades = document.getElementById('sb-motorBlades');
      const motorHub = document.getElementById('sb-motorHub');
      const flowPath = document.getElementById('sb-flowPath');
      const motorPill = document.getElementById('sb-motor-pill');
      const motorPillTxt = document.getElementById('sb-motor-pill-text');
      const tankSummary = document.getElementById('sb-tank-summary');

      if (!bottomWater) return; // widget not present on this page render for some reason

      const BOTTOM_TOP_Y = 34, BOTTOM_H = 96;
      const TOP_TOP_Y = 14, TOP_H = 96;

      function decodeTank(low, high) {
        if (low === null || low === undefined || high === null || high === undefined) {
          return { label: 'No data', level: 0.06, error: false, unknown: true };
        }
        low = parseInt(low, 10);
        high = parseInt(high, 10);
        if (low === 1 && high === 1) return { label: 'Full', level: 1.00, error: false, unknown: false };
        if (low === 1 && high === 0) return { label: 'Half', level: 0.50, error: false, unknown: false };
        if (low === 0 && high === 0) return { label: 'Empty', level: 0.05, error: false, unknown: false };
        return { label: 'Sensor error', level: 0.30, error: true, unknown: false };
      }

      function setTankRect(rectEl, topY, height, fraction) {
        const filledH = Math.max(height * fraction, 3);
        const y = topY + (height - filledH);
        rectEl.setAttribute('y', y);
        rectEl.setAttribute('height', filledH);
      }

      function applyTank(waterEl, errorEl, topY, height, info) {
        setTankRect(waterEl, topY, height, info.level);
        errorEl.style.opacity = info.error ? '0.35' : '0';
      }

      function setMotor(running) {
        if (running === null || running === undefined) {
          motorCircle.classList.remove('running');
          motorBlades.classList.remove('running');
          motorHub.classList.remove('running');
          flowPath.classList.remove('flowing');
          motorPill.classList.remove('off', 'err');
          motorPill.classList.add('off');
          motorPillTxt.textContent = 'Unknown';
          return;
        }
        motorCircle.classList.toggle('running', running);
        motorBlades.classList.toggle('running', running);
        motorHub.classList.toggle('running', running);
        flowPath.classList.toggle('flowing', running);
        motorPill.classList.toggle('off', !running);
        motorPillTxt.textContent = running ? 'Running' : 'Stopped';
      }

      async function refreshSidebarTankWidget() {
        try {
          const res = await fetch('/api/live');
          const payload = await res.json();
          if (payload.status !== 'ok') {
            applyTank(bottomWater, bottomError, BOTTOM_TOP_Y, BOTTOM_H, decodeTank(null, null));
            applyTank(topWater, topError, TOP_TOP_Y, TOP_H, decodeTank(null, null));
            setMotor(null);
            tankSummary.textContent = 'Bottom: -- \u00b7 Top: --';
            return;
          }
          const m = payload.data.measurements;
          const bottomInfo = decodeTank(m.tank_bottom_low, m.tank_bottom_high);
          const topInfo = decodeTank(m.tank_top_low, m.tank_top_high);

          applyTank(bottomWater, bottomError, BOTTOM_TOP_Y, BOTTOM_H, bottomInfo);
          applyTank(topWater, topError, TOP_TOP_Y, TOP_H, topInfo);

          const runStop = m.control_run_stop ?? null;
          setMotor(runStop === null ? null : runStop === 1);

          tankSummary.textContent = `Bottom: ${bottomInfo.label} \u00b7 Top: ${topInfo.label}`;
        } catch (e) {
          console.error('Sidebar tank widget refresh error:', e);
        }
      }

      // smooth transition after first paint so the initial load doesn't
      // animate up from an empty tank
      requestAnimationFrame(() => {
        bottomWater.style.transition = 'y 0.6s ease, height 0.6s ease';
        topWater.style.transition = 'y 0.6s ease, height 0.6s ease';
      });

      refreshSidebarTankWidget();
      setInterval(refreshSidebarTankWidget, 4000);
    })();
  </script>


  <script>
    (function () {
      const overlay = document.getElementById('fault-modal-overlay');
      const titleEl = document.getElementById('fault-modal-title');
      const helpEl = document.getElementById('fault-modal-help-text');
      const ackBtn = document.getElementById('fault-modal-ack-btn');
      if (!overlay) return;

      const ACK_STORAGE_KEY = 'pumpguru-ack-fault';

      // DEMO "what to do" text per fault key — swap in your real copy later.
      // Keys must match config/register_map.py FAULT_CODE_MAP.
      // "what to do" text per fault key — matches config/register_map.py FAULT_CODE_MAP.
      const FAULT_HELP_TEXT = {
        dry_run: 'Check the pump wire connection and water level. Also check the dry run % setting.',
        overload: 'Check if the pump is jammed, or has bush, bearing, or winding damage. Also check pump wiring and overload settings.',
        stall_pump: 'Check if the pump rotor is stuck, jammed, or facing excessive mechanical resistance — similar to an overload or blockage condition.',
        phase_reverse: 'Check the incoming supply wire sequence — verify the Red, Yellow, and Blue phase order is correct.',
        undervoltage: 'Check incoming supply voltage with a multimeter. R-Y, Y-B, B-R should read 360–480 VAC, and R-N, Y-N, B-N should read approx. 200–240 VAC.',
        phase_loss: 'Check incoming supply voltage with a multimeter. R-Y, Y-B, B-R should read 360–480 VAC, and R-N, Y-N, B-N should read approx. 200–240 VAC.',
        overvoltage: 'Check incoming supply voltage with a multimeter. R-Y, Y-B, B-R should read 360–480 VAC, and R-N, Y-N, B-N should read approx. 200–240 VAC.',
      };
      // const DEFAULT_GUIDANCE = 'Check the device and clear the fault before the pump resumes.';

      let CONFIG = null;
      let activeKey = null;

      function showModal(key, label) {
        activeKey = key;
        titleEl.textContent = (label || key).toUpperCase();
        helpEl.textContent = FAULT_HELP_TEXT[key] || 'Refer to the device manual for this fault code.';
        overlay.classList.add('show');
      }
      function hideModal() { overlay.classList.remove('show'); }

      ackBtn.addEventListener('click', function () {
        if (activeKey) localStorage.setItem(ACK_STORAGE_KEY, activeKey);
        hideModal();
      });

      async function checkFault() {
        try {
          if (!CONFIG) {
            const cfgRes = await fetch('/api/config');
            CONFIG = await cfgRes.json();
          }
          const res = await fetch('/api/live');
          const payload = await res.json();
          if (payload.status !== 'ok') return;

          const f = payload.data.faults;
          const faultKeys = CONFIG.faults ? Object.keys(CONFIG.faults) : [];
          const active = faultKeys.find(k => f[k] === true);

          if (!active) {
            // fault cleared -> forget the ack, so the SAME fault popping up
            // again later will show fresh
            localStorage.removeItem(ACK_STORAGE_KEY);
            hideModal();
            return;
          }
          if (localStorage.getItem(ACK_STORAGE_KEY) === active) {
            hideModal();
            return;
          }
          showModal(active, CONFIG.faults[active]?.label || active);
        } catch (e) {
          console.error('Fault modal check error:', e);
        }
      }

      checkFault();
      setInterval(checkFault, 4000);
    })();
  </script>

  {% block scripts %}{% endblock %}
</body>

</html>
